<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Interactive Cell</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef7ff;color:#123}
#app{height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:white;box-shadow:0 2px 10px #0001;z-index:2}
h1{font-size:20px;margin:0 0 4px;color:#1767a8}header p{margin:0;font-size:13px;color:#567}
#toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#fff;z-index:2}
button{border:1px solid #ccd8e5;background:white;border-radius:10px;padding:9px 12px;font-weight:600;color:#245;cursor:pointer}
button.active{background:#dff3e4;border-color:#55a86a;color:#176b35}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#info{position:absolute;right:12px;top:12px;width:min(330px,calc(100% - 24px));background:#fffffff5;border-radius:16px;padding:16px;box-shadow:0 8px 30px #0002;display:none;z-index:3}
#info h2{margin:0 0 7px;color:#197044;font-size:19px}#info p{margin:6px 0;line-height:1.45;font-size:14px}
#close{position:absolute;right:9px;top:7px;border:0;padding:5px;background:#eee;border-radius:50%}
#hint{position:absolute;left:12px;bottom:12px;background:#ffffffdd;padding:9px 12px;border-radius:12px;font-size:12px;z-index:2}
#legend{font-size:12px;color:#567;margin-left:auto;padding:8px}
@media(max-width:600px){h1{font-size:18px}#info{top:8px;padding:13px}button{padding:8px 10px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header><h1>🧬 3D Interactive Cell</h1><p>Putar, zoom, dan klik organel untuk melihat informasi.</p></header>
<div id="toolbar">
<button id="plant" class="active">🌱 Sel Tumbuhan</button>
<button id="animal">🐾 Sel Hewan</button>
<button id="reset">↻ Reset</button>
<button id="zoomIn">＋ Zoom</button><button id="zoomOut">－ Zoom</button>
<span id="legend">Geser = rotasi • Cubit = zoom • Ketuk organel = info</span>
</div>
<div id="stage">
<div id="info"><button id="close">×</button><h2 id="infoTitle"></h2><p id="infoText"></p></div>
<div id="hint">Model 3D dapat diputar 360° dengan jari.</div>
</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const stage=document.getElementById('stage');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeaf5ff);
const camera=new THREE.PerspectiveCamera(45,stage.clientWidth/stage.clientHeight,.1,100);
camera.position.set(0,7.2,10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(stage.clientWidth,stage.clientHeight); renderer.shadowMap.enabled=true;
stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.minDistance=5; controls.maxDistance=18;

scene.add(new THREE.HemisphereLight(0xffffff,0x557799,2.2));
const dl=new THREE.DirectionalLight(0xffffff,3); dl.position.set(5,9,7); dl.castShadow=true; scene.add(dl);

let cellGroup=new THREE.Group(); scene.add(cellGroup);
let clickable=[];
const info={
"Membran Sel":["Membran Sel","Lapisan tipis yang mengatur keluar-masuknya zat dan melindungi bagian dalam sel."],
"Dinding Sel":["Dinding Sel","Lapisan kaku pada sel tumbuhan yang memberi bentuk, kekuatan, dan perlindungan."],
"Nukleus":["Nukleus","Pusat pengendali sel yang menyimpan sebagian besar materi genetik (DNA)."],
"Nukleolus":["Nukleolus","Bagian di dalam nukleus yang berperan dalam pembentukan ribosom."],
"Kloroplas":["Kloroplas","Organel pada tumbuhan yang melakukan fotosintesis dengan bantuan klorofil."],
"Vakuola":["Vakuola","Ruang penyimpanan air, ion, pigmen, dan berbagai zat. Pada tumbuhan biasanya sangat besar."],
"Mitokondria":["Mitokondria","Menghasilkan sebagian besar energi sel dalam bentuk ATP melalui respirasi seluler."],
"Ribosom":["Ribosom","Tempat sintesis protein."],
"RE Kasar":["Retikulum Endoplasma Kasar","Membantu membuat dan memproses protein; permukaannya ditempeli ribosom."],
"RE Halus":["Retikulum Endoplasma Halus","Berperan antara lain dalam sintesis lipid dan detoksifikasi."],
"Badan Golgi":["Badan Golgi","Memodifikasi, menyortir, dan mengemas protein serta lipid untuk dikirim ke bagian lain."],
"Lisosom":["Lisosom","Organel yang mengandung enzim untuk memecah berbagai bahan di dalam sel hewan."],
"Sentriol":["Sentriol","Struktur yang membantu pengaturan mikrotubulus dan berperan dalam pembelahan sel hewan."]
};

function mat(c,op=1){return new THREE.MeshStandardMaterial({color:c,roughness:.55,transparent:op<1,opacity:op})}
function add(obj,name){obj.userData.name=name; clickable.push(obj); cellGroup.add(obj); return obj}
function ellipsoid(name,pos,scale,color){
 const m=add(new THREE.Mesh(new THREE.SphereGeometry(1,28,20),mat(color)),name);m.position.set(...pos);m.scale.set(...scale);return m
}
function torus(name,pos,scale,color,rot=[Math.PI/2,0,0]){
 const m=add(new THREE.Mesh(new THREE.TorusGeometry(1,.12,12,32),mat(color)),name);m.position.set(...pos);m.scale.set(...scale);m.rotation.set(...rot);return m
}
function clear(){cellGroup.clear();clickable=[]}
function buildPlant(){
 clear();
 // outer wall and membrane
 const wall=add(new THREE.Mesh(new THREE.BoxGeometry(8.7,1.05,7.4),mat(0x78b94b)), "Dinding Sel"); wall.position.y=-.45; wall.scale.z=.95;
 const mem=add(new THREE.Mesh(new THREE.BoxGeometry(8.1,.7,6.8),mat(0xbce889,.55)),"Membran Sel");mem.position.y=-.15;
 // cytoplasm base
 const cy=new THREE.Mesh(new THREE.BoxGeometry(7.7,.45,6.4),mat(0xe7f3a1));cy.position.y=.2;cellGroup.add(cy);
 // nucleus + nucleolus
 ellipsoid("Nukleus",[-2.1,.9,1.5],[1.35,.65,1.25],0x9d68cf);
 ellipsoid("Nukleolus",[-2.1,1.2,1.55],[.48,.28,.48],0x55247f);
 // vacuole
 ellipsoid("Vakuola",[1.4,.75,.2],[2.7,.55,2.15],0x8ed8ed);
 // chloroplasts
 [[-2.8,.5,-1.8],[2.8,.55,-1.8],[3.0,.55,1.8],[-3.1,.55,.0]].forEach(p=>{
   const c=ellipsoid("Kloroplas",p,[.72,.3,.42],0x4d9f36);
   for(let i=-1;i<=1;i++) ellipsoid("Kloroplas", [p[0]+i*.17,p[1]+.02,p[2]-.03],[.11,.08,.32],0x9ad64d);
 });
 // mitochondria
 [[0,.7,2.5],[.1,.7,-2.6],[-.4,.72,-.4]].forEach(p=>ellipsoid("Mitokondria",p,[.65,.25,.32],0xf07b38));
 // golgi
 for(let i=0;i<4;i++) torus("Badan Golgi",[.0,.75+i*.02,.9],[.6,.18,.28],0xd47b27,[0,0,0]);
 // rough ER ribbons
 for(let i=0;i<3;i++){const r=torus("RE Kasar",[-2.0,.72,-.05],[1.15,.1,.65],0x4f9ed8,[0,0,0]);r.rotation.y=i*.15}
 // smooth ER
 torus("RE Halus",[-1.0,.72,1.0],[.9,.08,.55],0x49c1c6,[0,0,0]);
 // ribosomes
 for(let i=0;i<18;i++){const x=-3.5+Math.random()*7,z=-2.7+Math.random()*5.4;ellipsoid("Ribosom",[x,.82,z],[.08,.08,.08],0x255da8)}
}
function buildAnimal(){
 clear();
 const mem=ellipsoid("Membran Sel",[0,0,0],[4.25,1.15,3.35],0x70b7df); mem.material=mat(0x72bde5,.45);
 const cy=ellipsoid("Membran Sel",[0,.05,0],[3.95,.85,3.05],0xd7ecff);cy.material=mat(0xd7ecff,.82);
 ellipsoid("Nukleus",[-1.2,.65,.8],[1.45,.7,1.25],0x9d68cf);
 ellipsoid("Nukleolus",[-1.2,.95,.8],[.5,.3,.48],0x55247f);
 [[1.5,.55,1.2],[1.7,.55,-1.0],[-2.1,.6,-1.3],[.0,.58,-2.0]].forEach(p=>ellipsoid("Mitokondria",p,[.7,.25,.35],0xf07b38));
 for(let i=0;i<4;i++)torus("Badan Golgi",[.2,.6,.6+i*.12],[.65,.14,.3],0xd47b27,[0,0,0]);
 torus("RE Kasar",[-1.3,.6,-.15],[1.15,.1,.6],0x4f9ed8,[0,0,0]);
 torus("RE Halus",[-.2,.58,1.3],[.8,.08,.5],0x49c1c6,[0,0,0]);
 for(let i=0;i<8;i++)ellipsoid("Lisosom",[-2.7+Math.random()*5,.7,-2+Math.random()*4],[.16,.16,.16],0xe06ca5);
 // centrioles
 const s=new THREE.Group();s.userData.name="Sentriol";s.position.set(2.2,.75,.0);
 for(let j=0;j<2;j++){const q=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.85,16),mat(0xe1a72e));q.rotation.z=Math.PI/2;q.position.x=j*.42-.21;s.add(q)}
 clickable.push(s);cellGroup.add(s);
}
function show(name){const d=info[name];if(!d)return;document.getElementById('infoTitle').textContent=d[0];document.getElementById('infoText').textContent=d[1];document.getElementById('info').style.display='block'}
document.getElementById('close').onclick=()=>document.getElementById('info').style.display='none';
document.getElementById('plant').onclick=()=>{buildPlant();document.getElementById('plant').classList.add('active');document.getElementById('animal').classList.remove('active');resetView()};
document.getElementById('animal').onclick=()=>{buildAnimal();document.getElementById('animal').classList.add('active');document.getElementById('plant').classList.remove('active');resetView()};
function resetView(){camera.position.set(0,7.2,10);controls.target.set(0,0,0);controls.update()}
document.getElementById('reset').onclick=resetView;
document.getElementById('zoomIn').onclick=()=>camera.position.multiplyScalar(.85);
document.getElementById('zoomOut').onclick=()=>camera.position.multiplyScalar(1.15);

const ray=new THREE.Raycaster(), pointer=new THREE.Vector2();
function click(e){
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(clickable,true);
 if(hits.length){let o=hits[0].object;while(o && !o.userData.name)o=o.parent;if(o)show(o.userData.name)}
}
renderer.domElement.addEventListener('pointerup',click);
window.addEventListener('resize',()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
buildPlant();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
